<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Barthélémy Vielle</title>
<style>
  /* ---- WORK / FASHION PRINT — diorama isométrique : sol iso, pièces posées (base + ombre),
         images réelles lisibles. Navigation pan/zoom orthographique. N&B + couleur des prints. ---- */
  :root{--paper:#FCFCFB;--ink:#0A0A0A;--mute:#9F9F9A;--hair:#E8E8E3;--flame:#FF4D14;color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}

  #stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;top:0;left:0;width:4200px;height:3000px;transform-origin:0 0;will-change:transform;
    background-image:
      repeating-linear-gradient(26.57deg, var(--hair) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(-26.57deg, var(--hair) 0 1px, transparent 1px 72px);
    background-position:center}

  .sect{position:absolute;pointer-events:none}
  .sect .ey{display:block;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}
  .sect .h{display:block;font-size:84px;font-weight:700;letter-spacing:-.02em;text-transform:uppercase;line-height:.9;margin-top:10px}
  .sect .h em{font-style:normal;-webkit-text-stroke:1.5px var(--ink);color:transparent}

  .piece{position:absolute;width:0;height:0}
  .lift{position:absolute;left:0;bottom:0;transform:translate(-50%,-100%);cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.3,1)}
  .piece:hover .lift{transform:translate(-50%,-100%) translateY(-14px)}
  .shot{width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat;
    border:1.5px solid var(--ink);box-shadow:12px 16px 0 rgba(10,10,10,.1);transition:box-shadow .25s,outline-color .2s;outline:0 solid var(--flame)}
  .piece.active .shot{outline:3px solid var(--flame);outline-offset:4px}
  .plabel{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:12px;text-align:center;white-space:nowrap;
    opacity:.75;transition:opacity .2s}
  .piece:hover .plabel,.piece.active .plabel{opacity:1}
  .plabel .t{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .piece.active .plabel .t{color:var(--flame)}
  .plabel .k{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:4px}

  .ui{position:fixed;z-index:20;font-size:10px;letter-spacing:.22em;text-transform:uppercase;user-select:none}
  #brand{top:max(18px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;align-items:baseline;gap:.9em}
  #brand b{font-size:12px;font-weight:700;letter-spacing:.16em} #brand span{color:var(--mute)}
  #nav{top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:.4em}
  #navtog{all:unset;cursor:pointer;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border:1.5px solid var(--ink);padding:.55em .9em;background:var(--paper)}
  #navtog.open{background:var(--ink);color:var(--paper)}
  #navlist{display:none;flex-direction:column;align-items:flex-end;gap:.55em;margin-top:.35em;max-height:72vh;overflow:auto;padding:2px}
  #navlist.open{display:flex}
  #navlist button{all:unset;cursor:pointer;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:color .2s}
  #navlist button:hover{color:var(--ink)} #navlist button.on{color:var(--flame)}
  #navlist button .n{color:var(--hair);margin-right:.6em;font-variant-numeric:tabular-nums}
  #navlist button:hover .n,#navlist button.on .n{color:var(--mute)}
  #foot{bottom:max(16px,env(safe-area-inset-bottom,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.5em}
  #foot a{color:var(--mute);text-decoration:none} #clock,#hud{color:var(--mute);font-variant-numeric:tabular-nums}
  #hint{bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--mute);text-align:center;transition:opacity .5s}
  #home{bottom:max(14px,env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));font:inherit;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:.7em 1.1em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
  #home.show{opacity:1;pointer-events:auto}

  #panel{position:fixed;z-index:25;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%) translateX(14px);
    width:min(320px,80vw);border:1.5px solid var(--ink);background:var(--paper);padding:22px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
  #panel.show{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
  #panel .pc{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  #panel h2{margin:.4em 0 .15em;font-size:clamp(1.6rem,4vw,2.1rem);font-weight:700;letter-spacing:-.02em;text-transform:uppercase;line-height:.95}
  #panel .pcl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--flame);display:block;margin-bottom:1.1em}
  #panel .pp{font-size:.86rem;line-height:1.5;color:var(--ink);margin:0 0 1.3em}
  #panel .pp b{font-weight:700}
  #panel .px{all:unset;cursor:pointer;font-size:10px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:3px}
  @media(max-width:620px){#panel{right:0;left:0;top:auto;bottom:0;transform:translateY(16px);width:100%}#panel.show{transform:translateY(0)}
    #navlist button{font-size:14px;padding:.15em 0}}
  @media(prefers-reduced-motion:reduce){.lift{transition:none}}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<header id="brand" class="ui"><b>Barthélémy Vielle</b><span>CLVSTR</span></header>
<nav id="nav" class="ui"></nav>
<div id="foot" class="ui">
  <a id="mail" href="mailto:barthelemy.vielle@gmail.com">barthelemy.vielle@gmail.com</a>
  <span id="clock">Beaucens —:—:—</span><span id="hud">X ——  Y ——  ·  Z ——</span>
</div>
<div id="hint" class="ui">Glisser · zoomer · cliquer une pièce</div>
<button id="home" type="button">Vue d'ensemble</button>
<aside id="panel">
  <span class="pc"></span><h2 class="pt"></h2><span class="pcl"></span><p class="pp"></p>
  <button class="px" type="button">← Retour</button>
</aside>

<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var world=document.getElementById("world"),stage=document.getElementById("stage"),hudEl=document.getElementById("hud");

  var PRINTS=[
    {n:"Lychen",   cl:"TRENDT",     pr:"Numérisation · Sérigraphie",              img:"assets/fashion/p02.jpg",a:1055/748, c:0,r:0},
    {n:"Bark",     cl:"TRENDT",     pr:"Photographie · Sérigraphie",             img:"assets/fashion/p05.jpg",a:718/1014,c:1,r:0},
    {n:"Snow",     cl:"TRENDT",     pr:"Photographie · Sérigraphie",             img:"assets/fashion/p07.jpg",a:843/599, c:2,r:0},
    {n:"Espinhos", cl:"TRENDT",     pr:"Dessin et numérisation",                 img:"assets/fashion/p09.jpg",a:697/956, c:3,r:0},
    {n:"Burst",    cl:"Rockaedron", pr:"Numérisation · Encre rongeante · Sérigraphie",img:"assets/fashion/p11.jpg",a:787/988,c:0,r:1},
    {n:"Cliff",    cl:"Rockaedron", pr:"Photographie · Composition",             img:"assets/fashion/p13.jpg",a:909/644, c:1,r:1},
    {n:"Diorama",  cl:"U-Exist",    pr:"Numérisation · Composition",             img:"assets/fashion/p14.jpg",a:1101/1553,c:2,r:1},
    {n:"Norscape", cl:"U-Exist",    pr:"Numérisation · Composition · Impression directe",img:"assets/fashion/p20.jpg",a:1915/1353,c:3,r:1},
    {n:"Klondike", cl:"U-Exist",    pr:"Numérisation · Composition",             img:"assets/fashion/p17.jpg",a:1862/1318,c:0,r:2},
    {n:"Vegan",    cl:"U-Exist",    pr:"Numérisation · Composition · Impression directe",img:"assets/fashion/p18.jpg",a:1529/1080,c:1,r:2},
    {n:"Marble IV",cl:"U-Exist",    pr:"Photographie · Composition",             img:"assets/fashion/p19.jpg",a:1408/996, c:2,r:2}
  ];
  var COLS=4,CW=540,CHt=480,RDX=175,SX=760,SY=840,CH=300; // grille aérée sur sol iso

  var pieces=[],minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  PRINTS.forEach(function(p,i){
    var col=i%COLS,row=Math.floor(i/COLS);
    var sx=SX+col*CW+row*RDX, sy=SY+row*CHt;
    var w=Math.max(170,Math.min(430,CH*p.a));
    var el=document.createElement("button");el.className="piece";el.type="button";el.dataset.i=i;
    el.style.cssText="left:"+sx+"px;top:"+sy+"px;z-index:"+(100+row*6);
    el.innerHTML='<div class="lift" style="width:'+w+'px;height:'+CH+'px">'
      +'<div class="shot" style="background-image:url(\''+p.img+'\')"></div>'
      +'<div class="plabel"><span class="t">'+p.n+'</span><span class="k">'+p.cl+'</span></div></div>';
    world.appendChild(el);pieces.push(el);
    minx=Math.min(minx,sx-w/2);maxx=Math.max(maxx,sx+w/2);miny=Math.min(miny,sy-CH-30);maxy=Math.max(maxy,sy+60);
  });
  // titre de section
  var sect=document.createElement("div");sect.className="sect";
  sect.style.cssText="left:"+(minx)+"px;top:"+(miny-210)+"px";
  sect.innerHTML='<span class="ey">Work · CLVSTR — Motifs textiles</span><span class="h">Fashion <em>Print</em></span>';
  world.appendChild(sect);miny-=230;
  var CONTENT={x:minx,y:miny,w:maxx-minx,h:maxy-miny};

  /* ---- transform ---- */
  var tx=0,ty=0,s=1,MIN=0.2,MAX=3.4,raf=null,vel={x:0,y:0};
  function apply(){world.style.transform="translate("+tx.toFixed(2)+"px,"+ty.toFixed(2)+"px) scale("+s.toFixed(4)+")";hud();}
  function hud(){if(!hudEl)return;hudEl.textContent="X "+Math.round((stage.clientWidth/2-tx)/s)+"  Y "+Math.round((stage.clientHeight/2-ty)/s)+"  ·  Z "+Math.round(s*100)+"%";}
  function stopAnim(){if(raf){cancelAnimationFrame(raf);raf=null;}}
  function clampS(v){return Math.max(MIN,Math.min(MAX,v));}
  function tweenTo(nx,ny,ns,dur,done){stopAnim();if(reduce){tx=nx;ty=ny;s=ns;apply();done&&done();return;}
    var x0=tx,y0=ty,s0=s,t0=performance.now();
    (function loop(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);tx=x0+(nx-x0)*e;ty=y0+(ny-y0)*e;s=s0+(ns-s0)*e;apply();
      if(k<1)raf=requestAnimationFrame(loop);else{raf=null;done&&done();}})(t0);}
  function inertia(){stopAnim();(function loop(){vel.x*=0.92;vel.y*=0.92;tx+=vel.x;ty+=vel.y;apply();
    if(Math.hypot(vel.x,vel.y)>0.15)raf=requestAnimationFrame(loop);else raf=null;})();}
  function fit(box,pad){var vw=stage.clientWidth,vh=stage.clientHeight;pad=pad||1.08;
    var ns=clampS(Math.min(vw/(box.w*pad),vh/(box.h*pad)));return {x:vw/2-(box.x+box.w/2)*ns,y:vh/2-(box.y+box.h/2)*ns,s:ns};}

  /* ---- focus ---- */
  var active=null,P=document.getElementById("panel");
  function setActive(i){pieces.forEach(function(el,k){el.classList.toggle("active",k===i);});
    [].forEach.call(document.querySelectorAll("#navlist button"),function(b){b.classList.toggle("on",+b.dataset.i===i);});
    if(i!=null){var p=PRINTS[i];P.querySelector(".pc").textContent="N."+(i<9?"0":"")+(i+1)+" · Motif textile";
      P.querySelector(".pt").textContent=p.n;P.querySelector(".pcl").textContent="Client · "+p.cl;
      P.querySelector(".pp").innerHTML="<b>Procédé.</b> "+p.pr;P.classList.add("show");}
    else P.classList.remove("show");
    updateHome();active=i;}
  function focus(i){setActive(i);var el=pieces[i],sx=parseFloat(el.style.left),sy=parseFloat(el.style.top),w=parseFloat(el.querySelector(".lift").style.width);
    var b={x:sx-w/2,y:sy-CH-20,w:w,h:CH+60},t=fit(b,1.5);tweenTo(t.x,t.y,t.s,700);hideHint();}
  function home(){setActive(null);var t=fit(CONTENT,1.1);tweenTo(t.x,t.y,t.s,700);}

  /* ---- wheel ---- */
  stage.addEventListener("wheel",function(e){e.preventDefault();stopAnim();
    var r=stage.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,ns=clampS(s*Math.exp(-e.deltaY*0.0016)),wx=(sx-tx)/s,wy=(sy-ty)/s;
    tx=sx-wx*ns;ty=sy-wy*ns;s=ns;apply();hideHint();updateHome();if(active!=null&&s<1.1)setActive(null);},{passive:false});

  /* ---- pan + inertie + pinch ---- */
  var pointers=new Map(),moved=0,downT=null,pinchD=0,pinchM=null,lastT=0;
  stage.addEventListener("pointerdown",function(e){stopAnim();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);
    if(pointers.size===1){stage.classList.add("drag");moved=0;downT=e.target.closest(".piece");vel.x=vel.y=0;lastT=performance.now();}
    else if(pointers.size===2){var p=[].slice.call(pointers.values());pinchD=dist(p[0],p[1]);pinchM=mid(p[0],p[1]);downT=null;}});
  stage.addEventListener("pointermove",function(e){if(!pointers.has(e.pointerId))return;var prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){var dx=e.clientX-prev.x,dy=e.clientY-prev.y;tx+=dx;ty+=dy;moved+=Math.abs(dx)+Math.abs(dy);
      var now=performance.now(),dt=Math.max(1,now-lastT);vel.x=dx/dt*16;vel.y=dy/dt*16;lastT=now;apply();hideHint();}
    else if(pointers.size===2){var p=[].slice.call(pointers.values()),nd=dist(p[0],p[1]),nm=mid(p[0],p[1]),r=stage.getBoundingClientRect(),sx=nm.x-r.left,sy=nm.y-r.top,ns=clampS(s*(nd/(pinchD||nd)));
      var wx=(sx-tx)/s,wy=(sy-ty)/s;tx=sx-wx*ns;ty=sy-wy*ns;s=ns;tx+=nm.x-pinchM.x;ty+=nm.y-pinchM.y;pinchD=nd;pinchM=nm;apply();hideHint();updateHome();}});
  function up(e){if(pointers.size===1&&moved<6){if(downT)focus(+downT.dataset.i);else if(active!=null)home();}
    else if(pointers.size===1&&moved>=6&&Math.hypot(vel.x,vel.y)>0.6)inertia();
    pointers.delete(e.pointerId);if(pointers.size<2)pinchD=0;if(pointers.size===0)stage.classList.remove("drag");}
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

  /* ---- clavier ---- */
  function zoomC(f){stopAnim();var vw=stage.clientWidth/2,vh=stage.clientHeight/2,ns=clampS(s*f),wx=(vw-tx)/s,wy=(vh-ty)/s;tx=vw-wx*ns;ty=vh-wy*ns;s=ns;apply();updateHome();}
  addEventListener("keydown",function(e){
    if(e.key==="ArrowUp")tweenTo(tx,ty+90,s,200);else if(e.key==="ArrowDown")tweenTo(tx,ty-90,s,200);
    else if(e.key==="ArrowLeft")tweenTo(tx+90,ty,s,200);else if(e.key==="ArrowRight")tweenTo(tx-90,ty,s,200);
    else if(e.key==="+"||e.key==="=")zoomC(1.22);else if(e.key==="-"||e.key==="_")zoomC(0.82);
    else if(e.key==="Escape"||e.key==="0")home();else return;e.preventDefault();hideHint();});

  /* ---- chrome ---- */
  var hint=document.getElementById("hint"),hintGone=false;function hideHint(){if(!hintGone){hintGone=true;hint.style.opacity="0";}}
  var homeBtn=document.getElementById("home");function updateHome(){homeBtn.classList.toggle("show",active!=null||s>1.12);}
  homeBtn.addEventListener("click",home);P.querySelector(".px").addEventListener("click",home);
  var nav=document.getElementById("nav");
  var navtog=document.createElement("button");navtog.id="navtog";navtog.type="button";navtog.textContent="Index";
  var navlist=document.createElement("div");navlist.id="navlist";
  var ov=document.createElement("button");ov.innerHTML='<span class="n">—</span>Vue d’ensemble';
  ov.addEventListener("click",function(){home();if(innerWidth<620)closeNav();});navlist.appendChild(ov);
  PRINTS.forEach(function(p,i){var b=document.createElement("button");b.dataset.i=i;
    b.innerHTML='<span class="n">'+(i<9?'0':'')+(i+1)+'</span>'+p.n;
    b.addEventListener("click",function(){focus(i);if(innerWidth<620)closeNav();});navlist.appendChild(b);});
  nav.appendChild(navtog);nav.appendChild(navlist);
  function openNav(){navtog.classList.add("open");navlist.classList.add("open");navtog.textContent="Index ✕";}
  function closeNav(){navtog.classList.remove("open");navlist.classList.remove("open");navtog.textContent="Index";}
  navtog.addEventListener("click",function(){navlist.classList.contains("open")?closeNav():openNav();});
  if(innerWidth>=620)openNav();
  var clk=document.getElementById("clock");function tick(){clk.textContent="Beaucens "+new Date().toLocaleTimeString("fr-FR");}tick();setInterval(tick,1000);
  addEventListener("resize",function(){if(active!=null)focus(active);else{var t=fit(CONTENT,1.1);tx=t.x;ty=t.y;s=t.s;apply();}});

  /* ---- entrée : les pièces montent du sol ---- */
  var end=fit(CONTENT,1.1);tx=end.x;ty=end.y;s=end.s;apply();
  if(!reduce){
    pieces.forEach(function(el){var lift=el.querySelector(".lift");
      var depth=(+el.style.zIndex)-100;
      lift.animate([
        {transform:"translate(-50%,-100%) translateY(46px)",opacity:0,easing:"cubic-bezier(.2,.7,.3,1)"},
        {transform:"translate(-50%,-100%) translateY(0)",opacity:1}
      ],{duration:720,delay:depth*26+120,fill:"backwards"});});
  }
})();
</script>
</body>
</html>
